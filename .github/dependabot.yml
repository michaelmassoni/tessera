version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # roborazzi 1.79 is built against 0.9.x; 0.10 is binary-incompatible (docs/decisions.md).
      - dependency-name: "io.github.sergio-sastre.ComposablePreviewScanner:*"
        versions: [">= 0.10.0"]
    groups:
      androidx-compose:
        patterns: ["androidx.compose*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
