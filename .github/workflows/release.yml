name: Release

# Each app is released on its own. Tag with <app>-v<version>, for example calculator-v1.0.0.
# The version in the tag must match versionName in apps/<app>/build.gradle.kts.
on:
  push:
    tags: ["*-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      app: ${{ steps.tag.outputs.app }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%%-v*}"
          version="${tag#*-v}"
          test -d "apps/$app" || { echo "::error::No module apps/$app for tag $tag"; exit 1; }
          grep -q "versionName = \"$version\"" "apps/$app/build.gradle.kts" \
            || { echo "::error::versionName in apps/$app does not match $version"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      # Secrets: TESSERA_KEYSTORE_BASE64 (base64 of the keystore), TESSERA_KEYSTORE_PASSWORD,
      # TESSERA_KEY_ALIAS, TESSERA_KEY_PASSWORD. The keystore exists only on the runner.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TESSERA_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::TESSERA_KEYSTORE_BASE64 secret is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "TESSERA_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          TESSERA_KEYSTORE_PASSWORD: ${{ secrets.TESSERA_KEYSTORE_PASSWORD }}
          TESSERA_KEY_ALIAS: ${{ secrets.TESSERA_KEY_ALIAS }}
          TESSERA_KEY_PASSWORD: ${{ secrets.TESSERA_KEY_PASSWORD }}
        run: ./gradlew :apps:${{ steps.tag.outputs.app }}:check :apps:${{ steps.tag.outputs.app }}:assembleRelease --console=plain

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="${{ steps.tag.outputs.app }}"
          version="${{ steps.tag.outputs.version }}"
          apk="tessera-$app-$version.apk"
          cp "apps/$app/build/outputs/apk/release/$app-release.apk" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$GITHUB_REF_NAME" "$apk" "$apk.sha256" \
            --title "Tessera ${app^} $version" --generate-notes

  # What F-Droid does (docs/fdroid.md): build the tag again on a fresh machine, unsigned, and check
  # it matches the published APK byte for byte apart from the signature. F-Droid only publishes our
  # signed APK when it does, so a mismatch here means the F-Droid build of this release will fail.
  reproducible:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: rebuild

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches only downloaded dependencies (the build itself runs without caches), so the rebuild
      # doesn't fetch everything from Maven Central again: it was rate-limited (HTTP 429).
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-37.1" "build-tools;37.0.0" > /dev/null

      - name: Build unsigned, without caches
        working-directory: rebuild
        run: ./gradlew :apps:${{ needs.release.outputs.app }}:assembleRelease --no-build-cache --no-configuration-cache --console=plain

      - name: Compare with the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="${{ needs.release.outputs.app }}"
          version="${{ needs.release.outputs.version }}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "tessera-$app-$version.apk"
          pip install --quiet apksigcopier==1.1.1
          export PATH="$ANDROID_HOME/build-tools/37.0.0:$PATH"
          if apksigcopier compare "tessera-$app-$version.apk" \
            --unsigned "rebuild/apps/$app/build/outputs/apk/release/$app-release-unsigned.apk"; then
            echo "Reproducible: the rebuild matches the published APK."
          else
            echo "::error::Not reproducible: the rebuild differs from tessera-$app-$version.apk, so F-Droid won't publish it."
            exit 1
          fi
